<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>For Riham</title>
<style>
/* ───────────────────────── palette ───────────────────────── */
:root{
  --ink:#0b0a0d;          /* page black */
  --ink-2:#141118;        /* card black */
  --ink-3:#1d1822;        /* raised */
  --rose:#b3213a;         /* deep red rose */
  --rose-2:#e04a63;       /* lighter rose for accents */
  --gold:#d6b26a;         /* warm gold */
  --gold-2:#f1dca4;
  --cream:#f4ecdf;        /* body text */
  --muted:#b9ab9a;
  --line:rgba(214,178,106,.22);
  --shadow:0 30px 60px -20px rgba(0,0,0,.7);
  --serif:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--sans);line-height:1.6;min-height:100vh;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:var(--gold)}
button{font:inherit;cursor:pointer}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:.01em}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:.9}
.lead{font-family:var(--serif);font-size:1.35rem;line-height:1.5;color:var(--gold-2)}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}
.hidden{display:none!important}

/* grain + vignette for the cinematic feel */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 20%,rgba(179,33,58,.10),transparent 55%),
             radial-gradient(ellipse at 80% 100%,rgba(214,178,106,.07),transparent 50%);}
body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2%,3%)}50%{transform:translate(3%,-1%)}75%{transform:translate(-1%,-2%)}100%{transform:translate(2%,2%)}}

/* ───────────────────────── lock screen ───────────────────────── */
#lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:
  radial-gradient(ellipse at 50% 110%,rgba(179,33,58,.35),transparent 60%),var(--ink);
  transition:opacity 1.2s ease,visibility 1.2s}
#lock.open{opacity:0;visibility:hidden}
.lock-card{text-align:center;padding:40px 28px;width:min(440px,100% - 32px);position:relative;z-index:2}
.crown{width:64px;height:64px;margin:0 auto 18px;color:var(--gold);filter:drop-shadow(0 0 18px rgba(214,178,106,.35));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lock-card h1{font-size:2.6rem;color:var(--gold-2);line-height:1.1;margin:6px 0 8px}
.lock-card .hint{font-family:var(--serif);font-size:1.25rem;color:var(--cream);margin:18px 0 26px;line-height:1.45}
.lock-form{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.lock-form input{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--cream);padding:16px 18px;border-radius:14px;font-size:1.1rem;text-align:center;letter-spacing:.08em;outline:none;transition:border-color .3s,box-shadow .3s}
.lock-form input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(214,178,106,.12)}
.lock-form input.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.btn{background:linear-gradient(135deg,var(--rose),#7d1529);color:#fff;border:0;padding:15px 22px;border-radius:14px;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 12px 30px -10px rgba(179,33,58,.8);transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#a7853f);color:#1a1208;box-shadow:0 12px 30px -10px rgba(214,178,106,.6)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold);box-shadow:none}
.lock-msg{min-height:1.6em;font-size:.95rem;color:var(--rose-2);margin-top:12px;transition:opacity .3s}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.petal{position:absolute;top:-6vh;width:14px;height:18px;border-radius:60% 60% 60% 60%/70% 70% 50% 50%;background:radial-gradient(circle at 30% 30%,var(--rose-2),var(--rose));opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.2}}

/* ───────────────────────── nav ───────────────────────── */
#site{position:relative;z-index:1;opacity:0;transition:opacity 1.4s ease .3s}
#site.show{opacity:1}
nav{position:sticky;top:0;z-index:50;background:rgba(11,10,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:14px;height:58px}
.brand{font-family:var(--serif);font-size:1.25rem;color:var(--gold-2);white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:4px 2px;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 13px;border-radius:999px;font-size:.84rem;letter-spacing:.04em;white-space:nowrap;transition:all .25s}
.tab:hover{color:var(--cream)}
.tab.active{color:var(--gold-2);border-color:var(--line);background:rgba(214,178,106,.08)}

/* ───────────────────────── sections ───────────────────────── */
.panel{display:none;animation:rise .8s ease both}
.panel.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.section-head{padding:64px 0 28px;text-align:center}
.section-head h2{font-size:clamp(2.2rem,6vw,3.6rem);color:var(--gold-2);line-height:1.05;margin-top:10px}
.section-head p{max-width:620px;margin:14px auto 0;color:var(--muted);font-size:1.02rem}
.rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0}
.next-row{display:flex;justify-content:center;padding:56px 0 80px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}

/* hero */
.hero{position:relative;min-height:calc(100vh - 58px);min-height:calc(100svh - 58px);display:grid;align-items:end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.06);animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{to{transform:scale(1.14) translateY(-1.5%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,13,.25) 0%,rgba(11,10,13,.1) 35%,rgba(11,10,13,.75) 70%,var(--ink) 100%)}
.hero-text{position:relative;z-index:2;padding:0 0 64px;max-width:760px}
.hero-text h1{font-size:clamp(2.8rem,9vw,5.4rem);line-height:1;color:var(--gold-2);margin:12px 0 8px;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.hero-text .names{font-family:var(--serif);font-size:1.15rem;color:var(--gold);letter-spacing:.08em;margin-bottom:22px}
.hero-text .lead{max-width:600px;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.hero-cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.intro{padding:70px 0 20px;display:grid;gap:40px;grid-template-columns:1fr;align-items:center}
@media(min-width:820px){.intro{grid-template-columns:1.1fr .9fr}}
.intro figure{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/5;max-height:600px}
.intro figure img{width:100%;height:100%;object-fit:cover}
.intro figcaption{position:absolute;left:0;right:0;bottom:0;padding:50px 20px 18px;background:linear-gradient(transparent,rgba(11,10,13,.9));font-family:var(--serif);font-size:1.05rem;color:var(--gold-2)}
.intro .copy p{color:var(--cream);font-size:1.05rem;margin-bottom:16px}
.intro .copy p+p{margin-top:4px}
.sig{font-family:var(--serif);font-size:1.6rem;color:var(--gold);margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:50px 0 10px}
.fact{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:center}
.fact b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--gold-2);font-weight:500}
.fact span{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* timeline */
.timeline{position:relative;padding:20px 0 20px}
.timeline::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:linear-gradient(var(--line),var(--gold),var(--line))}
.tl{position:relative;padding:0 0 48px 56px}
.tl::before{content:"";position:absolute;left:11px;top:8px;width:15px;height:15px;border-radius:50%;background:var(--ink);border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(214,178,106,.08)}
.tl.big::before{background:var(--rose);border-color:var(--rose-2);box-shadow:0 0 0 8px rgba(179,33,58,.18)}
.tl time{display:block;font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.tl h3{font-size:1.7rem;color:var(--gold-2);margin:4px 0 10px;line-height:1.15}
.tl p{color:var(--cream);max-width:620px}
.tl p+p{margin-top:10px}
.tl .media{margin-top:18px;border-radius:18px;overflow:hidden;max-width:420px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.tl .media img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .8s}
.tl .media:hover img{transform:scale(1.03)}
.tl .sub{margin:16px 0 0;padding-left:16px;border-left:2px solid rgba(179,33,58,.5)}
.tl .sub h4{font-family:var(--serif);font-size:1.2rem;color:var(--gold);font-weight:500;margin:14px 0 4px}
.tl .sub h4:first-child{margin-top:0}
@media(min-width:820px){
  .timeline::before{left:50%}
  .tl{width:50%;padding:0 56px 60px 0}
  .tl:nth-child(even){margin-left:50%;padding:0 0 60px 56px}
  .tl::before{left:auto;right:-8px}
  .tl:nth-child(even)::before{right:auto;left:-7px}
  .tl:nth-child(odd){text-align:right}
  .tl:nth-child(odd) p,.tl:nth-child(odd) .media{margin-left:auto}
  .tl:nth-child(odd) .sub{border-left:0;border-right:2px solid rgba(179,33,58,.5);padding-left:0;padding-right:16px}
}

/* gallery */
.grid{columns:2;column-gap:12px}
@media(min-width:700px){.grid{columns:3}}
@media(min-width:1000px){.grid{columns:4}}
.ph{break-inside:avoid;margin-bottom:12px;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;background:var(--ink-2);border:1px solid rgba(255,255,255,.04)}
.ph img{width:100%;transition:transform .9s ease,filter .5s}
.ph:hover img{transform:scale(1.04)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(11,10,13,.92));opacity:0;transition:opacity .4s}
.ph:hover .cap,.ph:focus .cap{opacity:1}
.ph .cap b{display:block;font-family:var(--serif);font-weight:500;font-size:1.05rem;color:var(--gold-2)}
.ph .cap span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@media(hover:none){.ph .cap{opacity:1;padding-top:26px}}

/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,5,8,.96);display:none;align-items:center;justify-content:center;padding:0}
#lb.open{display:flex}
.lb-in{width:100%;height:100%;display:grid;grid-template-rows:1fr auto;max-width:1100px}
@media(min-width:900px){.lb-in{grid-template-rows:none;grid-template-columns:1fr 360px;height:auto;max-height:92vh;margin:auto}}
.lb-img{display:grid;place-items:center;min-height:0;padding:14px}
.lb-img img{max-height:100%;max-width:100%;object-fit:contain;border-radius:12px;box-shadow:var(--shadow);max-height:58vh}
@media(min-width:900px){.lb-img img{max-height:88vh}}
.lb-txt{padding:14px 22px 30px;overflow:auto;background:linear-gradient(180deg,rgba(20,17,24,0),var(--ink-2) 30%)}
@media(min-width:900px){.lb-txt{background:var(--ink-2);padding:34px 28px;display:flex;flex-direction:column;justify-content:center}}
.lb-txt time{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.lb-txt h3{font-size:1.7rem;color:var(--gold-2);margin:6px 0 2px;line-height:1.15}
.lb-txt .loc{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.lb-txt p{color:var(--cream)}
.lb-x,.lb-prev,.lb-next{position:absolute;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--gold-2);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;backdrop-filter:blur(6px)}
.lb-x{top:14px;right:14px}
.lb-prev{left:10px;top:28vh}.lb-next{right:10px;top:28vh}
@media(min-width:900px){.lb-prev{top:50%;left:18px}.lb-next{top:50%;right:384px}}

/* cards */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:24px 22px;position:relative;overflow:hidden;transition:transform .35s,border-color .35s}
.card:hover{transform:translateY(-3px);border-color:rgba(214,178,106,.45)}
.card .ic{font-size:1.6rem;margin-bottom:10px;display:block;filter:drop-shadow(0 0 12px rgba(214,178,106,.25))}
.card h3{font-size:1.4rem;color:var(--gold-2);margin-bottom:6px;line-height:1.2}
.card .k{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:block}
.card p{color:var(--cream);font-size:.98rem}
.card ul{list-style:none;margin-top:6px}
.card li{padding:6px 0;border-top:1px dashed rgba(214,178,106,.15);font-size:.96rem}
.card li:first-child{border-top:0}
.card li a{text-decoration:none;border-bottom:1px solid rgba(214,178,106,.4)}
.card.photo{padding:0;min-height:320px}
.card.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform 1s}
.card.photo:hover img{transform:scale(1.04)}
.card.photo .over{position:relative;z-index:1;padding:140px 22px 22px;background:linear-gradient(transparent,rgba(11,10,13,.95) 55%);height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.card.wide{grid-column:1/-1}
.story{display:grid;gap:14px}
.st{display:grid;grid-template-columns:48px 1fr;gap:16px;background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:22px}
.st .n{font-family:var(--serif);font-size:2rem;color:var(--rose-2);line-height:1}
.st h3{font-size:1.45rem;color:var(--gold-2);margin-bottom:6px}
.st .meta{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.st p{color:var(--cream)}
.st p+p{margin-top:8px}
.st .media{margin-top:14px;border-radius:14px;overflow:hidden;max-width:360px;box-shadow:var(--shadow)}
.st img,.st video{width:100%}

/* language */
.vid{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.vid video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;max-height:520px}
.vid .t{padding:16px 18px}
.vid h3{font-size:1.6rem;color:var(--gold-2);letter-spacing:.04em}
.vid p{color:var(--muted);font-size:.95rem}
.loves{columns:1;column-gap:24px;margin-top:10px}
@media(min-width:720px){.loves{columns:2}}
.loves li{break-inside:avoid;list-style:none;padding:12px 0 12px 28px;border-bottom:1px solid rgba(214,178,106,.12);position:relative;color:var(--cream)}
.loves li::before{content:"";position:absolute;left:4px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--rose-2);box-shadow:0 0 10px var(--rose-2)}

/* letter */
.letter{max-width:760px;margin:0 auto;background:linear-gradient(180deg,#171219,#120f15);border:1px solid var(--line);border-radius:26px;padding:clamp(28px,6vw,64px);box-shadow:var(--shadow);position:relative}
.letter::before{content:"";position:absolute;inset:10px;border:1px solid rgba(214,178,106,.14);border-radius:18px;pointer-events:none}
.letter p{font-family:var(--serif);font-size:clamp(1.15rem,2.4vw,1.4rem);line-height:1.65;color:var(--cream);margin-bottom:20px}
.letter p.open{color:var(--gold-2);font-size:1.9rem;margin-bottom:28px}
.letter .sig{font-size:2rem;margin-top:30px}
.count{text-align:center;margin:0 auto 46px;max-width:760px}
.count .boxes{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.count .b{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:14px 10px;min-width:76px}
.count .b b{display:block;font-family:var(--serif);font-size:2.2rem;color:var(--gold-2);font-weight:500;line-height:1}
.count .b span{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.wish{max-width:760px;margin:40px auto 0;text-align:center;font-family:var(--serif);font-size:1.3rem;color:var(--gold-2);line-height:1.6}
.song{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:26px}
.song a{text-decoration:none;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:.9rem;color:var(--gold-2);background:rgba(214,178,106,.06)}

/* footer + easter egg */
footer{border-top:1px solid var(--line);padding:50px 0 70px;text-align:center;color:var(--muted);font-size:.9rem;position:relative}
footer .dates{font-family:var(--serif);font-size:1.3rem;color:var(--gold-2);margin-bottom:8px}
footer .heart{color:var(--rose-2)}
#egg{position:absolute;right:16px;bottom:16px;background:none;border:0;font-size:1.3rem;opacity:.28;transition:opacity .3s,transform .3s;filter:grayscale(.4)}
#egg:hover{opacity:.9;transform:rotate(-12deg) scale(1.1)}
#secret{position:fixed;inset:0;z-index:95;background:rgba(6,5,8,.92);display:none;place-items:center;padding:20px}
#secret.open{display:grid}
.secret-card{background:linear-gradient(160deg,#1c1420,#120e15);border:1px solid var(--gold);border-radius:24px;padding:36px 28px;max-width:480px;text-align:center;box-shadow:0 0 80px rgba(179,33,58,.35);animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.secret-card img{width:150px;height:150px;object-fit:cover;object-position:50% 15%;border-radius:50%;margin:0 auto 18px;border:3px solid var(--gold)}
.secret-card h3{font-size:1.5rem;color:var(--gold);margin-bottom:12px}
.secret-card p{font-family:var(--serif);font-size:1.35rem;color:var(--cream);line-height:1.5}
.secret-card .btn{margin-top:22px}
.muted-note{color:var(--muted);font-size:.85rem;text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ═══════════════════════ LOCK SCREEN ═══════════════════════ -->
<div id="lock" aria-label="Locked">
  <div class="petals" id="petals"></div>
  <div class="lock-card">
    <svg class="crown" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M8 46 L4 20 L20 32 L32 12 L44 32 L60 20 L56 46 Z"/><path d="M10 52 H54"/><circle cx="32" cy="12" r="2.5" fill="currentColor"/><circle cx="4" cy="20" r="2" fill="currentColor"/><circle cx="60" cy="20" r="2" fill="currentColor"/></svg>
    <div class="eyebrow">A private place</div>
    <h1>For Riham</h1>
    <p class="hint" id="hintText"></p>
    <form class="lock-form" id="lockForm" autocomplete="off">
      <input id="pw" type="text" inputmode="text" placeholder="type the answer…" aria-label="password" autocapitalize="characters">
      <button class="btn" type="submit">Open</button>
    </form>
    <div class="lock-msg" id="lockMsg" aria-live="polite"></div>
  </div>
</div>

<!-- ═══════════════════════ SITE ═══════════════════════ -->
<div id="site">

}

function buildLanguage() {
  const L = SITE.language;
  const v = L.videos.map(x => `<div class="vid reveal">${videoTag(x.src, x.poster)}<div class="t"><h3>${x.h}</h3><p>${x.p}</p></div></div>`).join("");
  const loves = L.loves.map(x => `<li>${x}</li>`).join("");
  return head("Chapter six", "Our language", L.intro) + `<div class="wrap"><div class="cards">${v}</div>
    <div class="section-head reveal" style="padding-top:70px"><div class="eyebrow">and</div><h2 style="font-size:2.4rem">Things I love about you</h2><div class="rule"></div></div>
    <ul class="loves reveal">${loves}</ul></div>` + nextBtn("language");
}

function buildLetter() {
  const L = SITE.letter;
  const lyric = L.customLyric ? `<p style="font-style:italic;color:var(--gold)">${L.customLyric}</p>` : "";
  return head("The last page", "A letter for you", "") + `<div class="wrap">
    <div class="count reveal"><div class="eyebrow">${L.countdownTitle}</div><div class="boxes" id="count"></div><div class="muted-note" id="countNote"></div></div>
    <div class="letter reveal"><p class="open">${L.opening}</p>${L.paragraphs.map(p => `<p>${p}</p>`).join("")}${lyric}<div class="sig">${L.signature}</div></div>
    <div class="wish reveal">${L.wish}</div>
    <div class="song reveal">${L.songs.map(s => `<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("")}</div>
    <div class="muted-note">${L.songLine}</div></div>` + nextBtn("letter");
}

const BUILD = { home: buildHome, story: buildStory, gallery: buildGallery, favourites: buildFavourites, her: buildHer, us: buildUs, language: buildLanguage, letter: buildLetter };

/* ───────────────────────── render ───────────────────────── */
function render() {
  $("#hintText").textContent = SITE.lock.hint;
  $("#footDates").textContent = SITE.footer;
  $("#secretImg").src = SITE.secret.img; $("#secretText").textContent = SITE.secret.text;
  const tabs = $("#tabs"), main = $("#main");
  SECTIONS.forEach(([id, label]) => {
    const b = el("button", "tab", label); b.dataset.go = id; tabs.appendChild(b);
    const s = el("section", "panel"); s.id = "sec-" + id; s.innerHTML = BUILD[id](); main.appendChild(s);
  });
}

let io;
function watchReveals() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08 });
  document.querySelectorAll(".panel.active .reveal").forEach(r => io.observe(r));
}

function go(id, push = true) {
  if (!BUILD[id]) id = "home";
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "sec-" + id));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.go === id));
  document.querySelectorAll("video").forEach(v => v.pause());
  const t = document.querySelector(`.tab[data-go="${id}"]`); if (t) t.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  if (push) history.replaceState(null, "", "#" + id);
  watchReveals();
  if (id === "letter") tickCountdown();
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const p = e.target.closest("[data-photo]"); if (p) openLB(+p.dataset.photo);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest("[data-photo]")) openLB(+e.target.closest("[data-photo]").dataset.photo); });

/* ───────────────────────── lightbox ───────────────────────── */
let cur = 0;
function openLB(i) { cur = i; showLB(); $("#lb").classList.add("open"); document.body.style.overflow = "hidden"; }
function showLB() {
  const p = SITE.photos[cur];
  $("#lbImg").src = p.src; $("#lbDate").textContent = p.date; $("#lbTitle").textContent = p.title; $("#lbLoc").textContent = p.loc; $("#lbStory").textContent = p.story;
}
function closeLB() { $("#lb").classList.remove("open"); document.body.style.overflow = ""; }
$("#lbX").onclick = closeLB;
$("#lbPrev").onclick = e => { e.stopPropagation(); cur = (cur - 1 + SITE.photos.length) % SITE.photos.length; showLB(); };
$("#lbNext").onclick = e => { e.stopPropagation(); cur = (cur + 1) % SITE.photos.length; showLB(); };
$("#lb").addEventListener("click", e => { if (e.target.id === "lb" || e.target.classList.contains("lb-img")) closeLB(); });
document.addEventListener("keydown", e => { if (!$("#lb").classList.contains("open")) return; if (e.key === "Escape") closeLB(); if (e.key === "ArrowLeft") $("#lbPrev").click(); if (e.key === "ArrowRight") $("#lbNext").click(); });
let tx = 0; $("#lb").addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
$("#lb").addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) (d < 0 ? $("#lbNext") : $("#lbPrev")).click(); });

/* ───────────────────────── countdown ───────────────────────── */
function nextBirthday() {
  const [y, m, d] = SITE.her.birthday.split("-").map(Number); const now = new Date();
  let t = new Date(now.getFullYear(), m - 1, d); if (t - now < -86400000) t = new Date(now.getFullYear() + 1, m - 1, d); return t;
}
function tickCountdown() {
  const box = $("#count"); if (!box) return;
  const t = nextBirthday(), now = new Date(), diff = t - now;
  const age = t.getFullYear() - Number(SITE.her.birthday.slice(0, 4));
  if (diff <= 0 && diff > -86400000) { box.innerHTML = `<div class="b" style="min-width:auto;padding:14px 22px"><b>🎂</b><span>it’s today</span></div>`; $("#countNote").textContent = `Happy ${age}th birthday, my queen.`; return; }
  const s = Math.floor(diff / 1000), dd = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  box.innerHTML = [[dd, "days"], [hh, "hours"], [mm, "minutes"], [ss, "seconds"]].map(x => `<div class="b"><b>${String(x[0]).padStart(2, "0")}</b><span>${x[1]}</span></div>`).join("");
  $("#countNote").textContent = `11 November — you turn ${age}.`;
}
setInterval(() => { if (document.querySelector("#sec-letter.active")) tickCountdown(); }, 1000);

/* ───────────────────────── easter egg ───────────────────────── */
$("#egg").onclick = () => $("#secret").classList.add("open");
$("#secretClose").onclick = () => $("#secret").classList.remove("open");
$("#secret").addEventListener("click", e => { if (e.target.id === "secret") $("#secret").classList.remove("open"); });
// the octopus photo in the gallery also opens the secret note (after a short pause, so the lightbox shows first)
document.addEventListener("click", e => { const p = e.target.closest("[data-photo]"); if (p && SITE.photos[+p.dataset.photo].src === SITE.secret.img) setTimeout(() => $("#secret").classList.add("open"), 1400); });

/* ───────────────────────── lock ───────────────────────── */
let wrongCount = 0;
function unlock(instant) {
  const lock = $("#lock");
  if (!instant) {
    const petals = $("#petals");
    for (let i = 0; i < 46; i++) { const p = el("div", "petal"); p.style.left = Math.random() * 100 + "%"; p.style.animationDuration = 3 + Math.random() * 3 + "s"; p.style.animationDelay = Math.random() * .8 + "s"; p.style.transform = `scale(${.6 + Math.random()})`; petals.appendChild(p); }
    $("#lockMsg").style.color = "var(--gold-2)"; $("#lockMsg").textContent = "Welcome, my queen. 👑";
  }
  setTimeout(() => { lock.classList.add("open"); $("#site").classList.add("show"); try { sessionStorage.setItem("riham-open", "1"); } catch (e) { } }, instant ? 0 : 1500);
}
$("#lockForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = norm($("#pw").value);
  if (v && fp(v) === SITE.lock.hash) { unlock(false); return; }
  const inp = $("#pw"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
  $("#lockMsg").textContent = SITE.lock.wrong[Math.min(wrongCount, SITE.lock.wrong.length - 1)]; wrongCount++;
  inp.select();
});

/* ───────────────────────── boot ───────────────────────── */
render();
go((location.hash || "#home").slice(1), false);
let already = false; try { already = sessionStorage.getItem("riham-open") === "1"; } catch (e) { }
if (already) unlock(true); else setTimeout(() => $("#pw").focus(), 600);
window.addEventListener("hashchange", () => go(location.hash.slice(1), false));
</script>
</body>
</html>
